<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>إلغاء الاشتراك | النقطة</title><style>body{font-family:Arial,sans-serif;background:#071426;color:#fff;margin:0;min-height:100vh;display:grid;place-items:center}main{max-width:560px;margin:20px;padding:32px;border:1px solid #28415e;border-radius:18px;background:#0d2038}p{line-height:1.9}button{font:inherit;padding:12px 24px;background:#d52a39;color:#fff;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.5}a{color:#fff}</style></head><body><main><h1>إلغاء الاشتراك في نشرة النقطة</h1><p>اضغط الزر لتوقف وصول أعداد النشرة التالية إلى بريدك. فتح هذه الصفحة وحده لا يلغي اشتراكك.</p><button id="cancel" type="button">تأكيد إلغاء الاشتراك</button><p id="status" role="status" aria-live="polite"></p><a href="/">العودة إلى الصفحة الرئيسية</a></main><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||'';
history.replaceState(null,'',location.pathname);
const button=document.getElementById('cancel'),message=document.getElementById('status');
if(!/^[A-Za-z0-9_-]{43}$/.test(token)){button.disabled=true;message.textContent='رابط الإلغاء غير مكتمل. افتح الرابط الموجود في النشرة البريدية.';}
button.addEventListener('click',async()=>{button.disabled=true;message.textContent='جارٍ إلغاء الاشتراك…';try{const response=await fetch('https://zsqvmuqlmtnhndwuqlfy.supabase.co/functions/v1/newsletter-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,confirm:true})});const data=await response.json();if(!response.ok||!data.ok)throw new Error();location.replace('/newsletter-result.html?status=unsubscribed');}catch{message.textContent='تعذر إلغاء الاشتراك. حاول مجدداً، أو تواصل مع التحرير من صفحة التواصل.';button.disabled=false;}});
</script></body></html>

<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>نتيجة تأكيد النشرة | النقطة</title><style>body{font-family:Arial,sans-serif;background:#071426;color:white;display:grid;place-items:center;min-height:100vh;margin:0}main{max-width:560px;margin:20px;padding:32px;border:1px solid #28415e;border-radius:18px;background:#0d2038}h1{color:#59d39a}p{line-height:1.9}a{color:white}</style></head><body><main><h1 id="title">نتيجة تأكيد النشرة</h1><p id="message">افتح رابط تأكيد البريد الوارد في رسالتك لإتمام الاشتراك.</p><a href="/">العودة إلى الصفحة الرئيسية</a></main><script>
const states={confirmed:["تم تأكيد الاشتراك","تم تفعيل اشتراك بريدك في نشرة النقطة. ستصلك النشرة بعد إطلاقها."],active:["الاشتراك مؤكد","بريدك مشترك بالفعل في نشرة النقطة."],invalid:["رابط غير صالح","الرابط غير مكتمل. اطلب رابط تأكيد جديد من نموذج الاشتراك."],expired:["الرابط منتهي أو مستخدم","إذا سبق أن أكّدت اشتراكك، فلا تحتاج إلى تأكيده مرة أخرى. وإلا اطلب رابطاً جديداً من نموذج الاشتراك."],error:["تعذر التأكيد","حاول مرة أخرى لاحقاً."]};
const status=new URLSearchParams(location.search).get("status"), result=states[status];
if(result){document.getElementById("title").textContent=result[0];document.getElementById("message").textContent=result[1];if(["invalid","expired","error"].includes(status))document.getElementById("title").style.color="#ef3340";}
</script></body></html>

name: Validate newsroom content

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "content/posts/**"
      - "scripts/build-content.mjs"
      - "package.json"
      - ".github/workflows/content-build.yml"
  push:
    branches:
      - main
      - feature/newsroom-cms-schema
    paths:
      - "content/posts/**"
      - "scripts/build-content.mjs"
      - "package.json"
      - ".github/workflows/content-build.yml"

permissions:
  contents: read

concurrency:
  group: newsroom-content-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build newsroom index
        run: npm run build:content

      - name: Validate generated JSON
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['data/posts.json', 'public/data/posts.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!Array.isArray(data.posts)) throw new Error(`${file}: posts must be an array`);
            for (const post of data.posts) {
              if (!post.slug || !post.title || !post.status) {
                throw new Error(`${file}: post missing slug/title/status`);
              }
            }
            console.log(`${file}: ${data.posts.length} post(s)`);
          }
          NODE

      - name: Verify generated files are identical
        run: cmp --silent data/posts.json public/data/posts.json

name: Validate newsroom content

on:
  pull_request:
    paths:
      - "content/posts/**"
      - "scripts/build-content.mjs"
      - "package.json"
      - ".github/workflows/content-build.yml"
  push:
    branches: [main, feature/newsroom-cms-schema]
    paths:
      - "content/posts/**"
      - "scripts/build-content.mjs"
      - "package.json"
      - ".github/workflows/content-build.yml"

permissions:
  contents: read

jobs:
  build-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build newsroom index
        run: npm run build:content
      - name: Validate generated JSON
        run: node -e "const fs=require('fs'); for (const f of ['data/posts.json','public/data/posts.json']) { const d=JSON.parse(fs.readFileSync(f,'utf8')); if(!Array.isArray(d.posts)) throw new Error(f+' posts must be an array'); for (const p of d.posts) { if(!p.slug || !p.title || !p.status) throw new Error(f+' contains a post missing slug/title/status'); } console.log(f+': '+d.posts.length+' post(s)'); }"

name: Validate newsroom content

on:
  pull_request:
    paths:
      - "content/posts/**"
      - "scripts/build-content.mjs"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "content/posts/**"
      - "scripts/build-content.mjs"
      - "package.json"

jobs:
  build-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build newsroom index
        run: npm run build:content
      - name: Check generated JSON
        run: node -e "const fs=require('fs'); for (const f of ['data/posts.json','public/data/posts.json']) { const d=JSON.parse(fs.readFileSync(f,'utf8')); if (!Array.isArray(d.posts)) throw new Error(f+' has no posts array'); }"

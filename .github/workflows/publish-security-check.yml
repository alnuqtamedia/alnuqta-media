name: Isolated publication security check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/main'
    environment: Backblaze
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test current guards in a networkless temporary database
        env:
          PGDATABASE: ${{ secrets.BACKUP_DATABASE_URL }}
        run: python3 scripts/test-publish-isolated.py

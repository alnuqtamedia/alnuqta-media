name: Publish Alnuqta Media

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build newsroom content
        run: npm run build:content

      - name: Inject dynamic homepage feed
        run: node scripts/inject-homepage-feed.mjs

      - name: Generate Supabase runtime config
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e "const fs=require('fs'); const key=process.env.SUPABASE_ANON_KEY||''; const js=\"window.ALNUQTA_SUPABASE_PUBLIC = { url: 'https://zsqvmuqlmtnhndwuqlfy.supabase.co', anonKey: \"+JSON.stringify(key)+\" };\"; fs.writeFileSync('public/supabase-public-config.js', js+'\\n');"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

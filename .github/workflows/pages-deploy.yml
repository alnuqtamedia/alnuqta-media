name: Publish Alnuqta Media

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build newsroom content
        run: npm run build:content

      - name: Inject dynamic homepage feed
        run: node scripts/inject-homepage-feed.mjs

      - name: Generate and verify Supabase runtime config
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const key = (process.env.SUPABASE_ANON_KEY || '').trim();
          if (!key) {
            console.error('SUPABASE_ANON_KEY is missing or empty.');
            process.exit(1);
          }
          const config = {
            url: 'https://zsqvmuqlmtnhndwuqlfy.supabase.co',
            anonKey: key
          };
          fs.writeFileSync(
            'public/supabase-public-config.js',
            'window.ALNUQTA_SUPABASE_PUBLIC = ' + JSON.stringify(config) + ';\n'
          );
          const generated = fs.readFileSync('public/supabase-public-config.js', 'utf8');
          if (!generated.includes('ALNUQTA_SUPABASE_PUBLIC') || !generated.includes(key)) {
            console.error('Supabase runtime config verification failed.');
            process.exit(1);
          }
          console.log('Supabase runtime config generated and verified.');
          NODE

      - name: Verify admin runtime dependencies
        run: |
          test -s public/supabase-public-config.js
          grep -q "ALNUQTA_SUPABASE_PUBLIC" public/supabase-public-config.js
          grep -q 'src="../public/supabase-public-config.js"' admin/index.html
          grep -q 'src="../public/supabase-public-config.js"' admin/dashboard.html
          echo "Admin runtime dependencies verified."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

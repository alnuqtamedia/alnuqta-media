<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>غرفة الأخبار | النقطة</title>
  <meta name="description" content="غرفة الأخبار في منصة النقطة للإعلام الاستقصائي.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:Cairo,Tajawal,sans-serif;background:#f8fafc;color:#0f172a}.article-body p{margin:1rem 0;line-height:2}.article-body h2{font-size:1.45rem;font-weight:800;margin:2rem 0 .75rem}.article-body ul{list-style:disc;padding-right:1.5rem;margin:1rem 0}.article-body a{color:#b91c1c;text-decoration:underline}</style>
</head>
<body>
<header class="border-b bg-slate-950 text-white"><div class="mx-auto max-w-6xl px-5 py-5 flex items-center justify-between gap-4"><a href="index.html" class="font-extrabold text-xl">النقطة <span class="text-red-500">|</span> Alnuqta</a><nav class="flex gap-5 text-sm"><a href="index.html" class="hover:text-red-400">الرئيسية</a><a href="newsroom.html" class="text-red-400">غرفة الأخبار</a></nav></div></header>
<main class="mx-auto max-w-6xl px-5 py-10">
  <section id="listing">
    <div class="mb-8"><p class="text-red-700 font-bold">غرفة الأخبار</p><h1 class="text-3xl md:text-5xl font-extrabold mt-2">المواد المنشورة</h1><p class="text-slate-600 mt-3">تُعرض هنا المواد التي وصلت إلى حالة النشر من نظام المحتوى.</p></div>
    <div class="flex flex-col md:flex-row gap-3 mb-8"><input id="search" class="flex-1 rounded-xl border px-4 py-3" placeholder="ابحث في العناوين والملخصات..."><select id="section" class="rounded-xl border px-4 py-3 bg-white"><option value="all">كل الأقسام</option><option value="investigation">تحقيق استقصائي</option><option value="report">تقرير</option><option value="news">خبر</option><option value="analysis">تحليل</option><option value="interview">مقابلة</option><option value="human-story">قصة إنسانية</option><option value="video">فيديو</option><option value="gallery">معرض صور</option></select></div>
    <div id="status" class="text-slate-500 mb-5">جاري تحميل المواد...</div><div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </section>
  <article id="reader" class="hidden max-w-4xl mx-auto"><button id="back" class="mb-6 text-red-700 font-bold">← العودة إلى غرفة الأخبار</button><div id="article"></div></article>
</main>
<footer class="mt-16 border-t bg-white"><div class="mx-auto max-w-6xl px-5 py-8 text-sm text-slate-500">© النقطة — منصة إعلامية استقصائية مستقلة.</div></footer>
<script>
const labels={investigation:'تحقيق استقصائي',report:'تقرير',news:'خبر',analysis:'تحليل',interview:'مقابلة','human-story':'قصة إنسانية',video:'فيديو',gallery:'معرض صور'};
let posts=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatDate=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('ar-IQ',{year:'numeric',month:'long',day:'numeric'});};
function bodyToHtml(v){let s=String(v??'');s=s.replace(/\r/g,'').trim();if(!s)return '<p class="text-slate-500">لا يوجد نص منشور.</p>';return s.split(/\n\s*\n/).map(p=>{const t=esc(p).replace(/^### (.*)$/gm,'<h2>$1</h2>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');return '<p>'+t.replace(/\n/g,'<br>')+'</p>';}).join('');}
function card(p){return `<article class="bg-white border rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition"><div class="h-44 bg-slate-200">${p.image?`<img src="${esc(p.image)}" alt="" class="w-full h-full object-cover" loading="lazy">`:''}</div><div class="p-5"><span class="text-xs font-bold text-red-700">${esc(labels[p.section]||p.section||'مادة')}</span><h2 class="text-xl font-extrabold mt-2 leading-8">${esc(p.title||'بدون عنوان')}</h2><p class="text-slate-600 mt-2 line-clamp-3">${esc(p.excerpt||p.subtitle||'')}</p><div class="text-xs text-slate-500 mt-4">${formatDate(p.date)}${p.reading_time?' · '+esc(p.reading_time)+' دقيقة':''}</div><button data-slug="${esc(p.slug||'')}" class="read mt-4 font-bold text-red-700">قراءة المادة ←</button></div></article>`}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const sec=document.getElementById('section').value;const filtered=posts.filter(p=>(sec==='all'||p.section===sec)&&(!q||`${p.title||''} ${p.excerpt||''} ${p.subtitle||''}`.toLowerCase().includes(q)));document.getElementById('status').textContent=filtered.length?`عدد المواد: ${filtered.length}`:'لا توجد مواد منشورة مطابقة.';document.getElementById('grid').innerHTML=filtered.map(card).join('');document.querySelectorAll('.read').forEach(b=>b.onclick=()=>openPost(b.dataset.slug));}
async function load(){try{const r=await fetch('data/posts.json',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();posts=(data.posts||[]).filter(p=>p.status==='published');render();}catch(e){document.getElementById('status').textContent='تعذر تحميل المواد حاليًا.';}}
function openPost(slug){const p=posts.find(x=>x.slug===slug);if(!p)return;document.getElementById('listing').classList.add('hidden');document.getElementById('reader').classList.remove('hidden');document.getElementById('article').innerHTML=`<div class="mb-8"><span class="text-red-700 font-bold">${esc(labels[p.section]||p.section||'مادة')}</span><h1 class="text-4xl md:text-5xl font-extrabold leading-tight mt-3">${esc(p.title)}</h1><p class="text-xl text-slate-600 mt-4">${esc(p.subtitle||p.excerpt||'')}</p><div class="text-sm text-slate-500 mt-5">${formatDate(p.date)}${p.author?' · '+esc(p.author):''}${p.editor?' · تحرير '+esc(p.editor):''}</div></div>${p.image?`<img src="${esc(p.image)}" alt="" class="w-full max-h-[520px] object-cover rounded-2xl mb-8">`:''}<div class="article-body text-lg">${bodyToHtml(p.body)}</div>`;history.pushState({slug},'',`newsroom.html?slug=${encodeURIComponent(slug)}`);window.scrollTo({top:0,behavior:'smooth'});}
document.getElementById('search').oninput=render;document.getElementById('section').onchange=render;document.getElementById('back').onclick=()=>{document.getElementById('reader').classList.add('hidden');document.getElementById('listing').classList.remove('hidden');history.pushState({},'', 'newsroom.html');};window.onpopstate=()=>location.reload();load();
</script></body></html>

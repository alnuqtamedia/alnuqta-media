<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>غرفة الأخبار | النقطة</title>
  <meta name="description" content="غرفة الأخبار في منصة النقطة للإعلام الاستقصائي.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:Cairo,Tajawal,sans-serif;background:#f8fafc;color:#0f172a}.article-body p{margin:1rem 0;line-height:2}.article-body h2{font-size:1.45rem;font-weight:800;margin:2rem 0 .75rem}.article-body ul{list-style:disc;padding-right:1.5rem;margin:1rem 0}.article-body a{color:#b91c1c;text-decoration:underline}.meta-card{background:#fff;border:1px solid #e2e8f0;border-radius:1rem;padding:1rem}.reader-hero{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}</style>
</head>
<body>
<header class="border-b bg-slate-950 text-white"><div class="mx-auto max-w-6xl px-5 py-5 flex items-center justify-between gap-4"><a href="index.html" class="font-extrabold text-xl">النقطة <span class="text-red-500">|</span> Alnuqta</a><nav class="flex gap-5 text-sm"><a href="index.html" class="hover:text-red-400">الرئيسية</a><a href="newsroom.html" class="text-red-400">غرفة الأخبار</a></nav></div></header>
<main class="mx-auto max-w-6xl px-5 py-10">
  <section id="listing"><div class="mb-8"><p class="text-red-700 font-bold">غرفة الأخبار</p><h1 class="text-3xl md:text-5xl font-extrabold mt-2">المواد المنشورة</h1><p class="text-slate-600 mt-3">تُعرض هنا المواد التي وصلت إلى حالة النشر من نظام المحتوى.</p></div>
  <div class="flex flex-col md:flex-row gap-3 mb-8"><input id="search" class="flex-1 rounded-xl border px-4 py-3" placeholder="ابحث في العناوين والملخصات..." aria-label="البحث في المواد"><select id="section" class="rounded-xl border px-4 py-3 bg-white" aria-label="تصفية حسب القسم"><option value="all">كل الأقسام</option><option value="investigation">تحقيق استقصائي</option><option value="report">تقرير</option><option value="news">خبر</option><option value="analysis">تحليل</option><option value="interview">مقابلة</option><option value="human-story">قصة إنسانية</option><option value="video">فيديو</option><option value="gallery">معرض صور</option></select></div>
  <div id="status" class="text-slate-500 mb-5">جاري تحميل المواد...</div><div id="grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-6"></div></section>
  <article id="reader" class="hidden max-w-4xl mx-auto"><button id="back" class="mb-6 text-red-700 font-bold">← العودة إلى غرفة الأخبار</button><div id="article"></div></article>
</main><footer class="mt-16 border-t bg-white"><div class="mx-auto max-w-6xl px-5 py-8 text-sm text-slate-500">© النقطة — منصة إعلامية استقصائية مستقلة.</div></footer>
<script>
const labels={investigation:'تحقيق استقصائي',report:'تقرير',news:'خبر',analysis:'تحليل',interview:'مقابلة','human-story':'قصة إنسانية',video:'فيديو',gallery:'معرض صور'};let posts=[];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const formatDate=v=>{if(!v)return '';const d=new Date(v);return Number.isNaN(d.getTime())?esc(v):d.toLocaleDateString('ar-IQ',{year:'numeric',month:'long',day:'numeric'});};
function inlineMd(v){return esc(v).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');}
function bodyToHtml(v){let s=String(v??'').replace(/\r/g,'').trim();if(!s)return '<p class="text-slate-500">لا يوجد نص منشور.</p>';const lines=s.split('\n');let html='',paragraph=[];const flush=()=>{if(paragraph.length){html+=`<p>${inlineMd(paragraph.join(' '))}</p>`;paragraph=[];}};for(const raw of lines){const line=raw.trim();if(!line){flush();continue;}if(/^###\s+/.test(line)||/^##\s+/.test(line)){flush();html+=`<h2>${inlineMd(line.replace(/^#{2,3}\s+/,''))}</h2>`;continue;}if(/^[-*]\s+/.test(line)){flush();html+=`<ul><li>${inlineMd(line.replace(/^[-*]\s+/,''))}</li></ul>`;continue;}paragraph.push(line);}flush();return html.replace(/<\/ul>\s*<ul>/g,'');}
function mediaUrl(v){return v?.url||'';}
function videoEmbed(v){const url=mediaUrl(v);if(!url)return '';const safe=esc(url);const yt=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([^?&/]+)/i);if(yt)return `<div class="mt-6 aspect-video"><iframe class="w-full h-full rounded-2xl" src="https://www.youtube.com/embed/${esc(yt[1])}" title="فيديو" loading="lazy" allowfullscreen></iframe></div>`;if(/vimeo\.com\//i.test(url)){const m=url.match(/vimeo\.com\/(?:video\/)?(\d+)/i);if(m)return `<div class="mt-6 aspect-video"><iframe class="w-full h-full rounded-2xl" src="https://player.vimeo.com/video/${esc(m[1])}" title="فيديو" loading="lazy" allowfullscreen></iframe></div>`;}if(v?.kind==='file'||/\.(mp4|webm|ogg)(?:\?|$)/i.test(url))return `<video class="w-full rounded-2xl mt-6" controls preload="metadata" src="${safe}"></video>`;return `<p class="mt-4"><a class="text-red-700 underline" href="${safe}" target="_blank" rel="noopener noreferrer">مشاهدة الفيديو</a></p>`;}
function mediaBlock(p){const gallery=Array.isArray(p.gallery)?p.gallery.filter(x=>mediaUrl(x)):[];const videos=Array.isArray(p.videos)?p.videos.filter(x=>mediaUrl(x)):[];let html='';if(videos.length)html+=`<section class="mt-10 border-t pt-6"><h2 class="text-2xl font-extrabold">الفيديو</h2>${videos.map(videoEmbed).join('')}</section>`;if(gallery.length)html+=`<section class="mt-10 border-t pt-6"><h2 class="text-2xl font-extrabold mb-4">معرض الصور</h2><div class="grid md:grid-cols-2 gap-4">${gallery.map(x=>`<img src="${esc(mediaUrl(x))}" alt="${esc(x.caption||p.title||'')}" class="w-full rounded-2xl object-cover" loading="lazy">`).join('')}</div></section>`;return html;}
function shareBlock(p){const u=encodeURIComponent(location.href),t=encodeURIComponent(p.title||'النقطة');return `<section class="mt-10 border-t pt-6"><h2 class="text-xl font-extrabold mb-4">شارك المادة</h2><div class="flex flex-wrap gap-3"><a class="px-4 py-2 border rounded-xl" target="_blank" rel="noopener noreferrer" href="https://www.facebook.com/sharer/sharer.php?u=${u}">Facebook</a><a class="px-4 py-2 border rounded-xl" target="_blank" rel="noopener noreferrer" href="https://twitter.com/intent/tweet?url=${u}&text=${t}">X</a><a class="px-4 py-2 border rounded-xl" target="_blank" rel="noopener noreferrer" href="https://wa.me/?text=${t}%20${u}">WhatsApp</a><a class="px-4 py-2 border rounded-xl" target="_blank" rel="noopener noreferrer" href="https://t.me/share/url?url=${u}&text=${t}">Telegram</a><button class="px-4 py-2 border rounded-xl" onclick="navigator.clipboard.writeText(location.href).then(()=>this.textContent='تم نسخ الرابط')">نسخ الرابط</button></div></section>`;}
function listBlock(title,items){if(!Array.isArray(items)||!items.length)return '';return `<section class="mt-8 border-t pt-6"><h2>${esc(title)}</h2><ul>${items.map(x=>`<li class="mb-2">${esc(typeof x==='string'?x:(x?.title||x?.url||''))}</li>`).join('')}</ul></section>`;}
function card(p){const cover=p.cover_image_url||p.image||p.gallery?.[0]?.url||'';const videoMark=p.section==='video'||(Array.isArray(p.videos)&&p.videos.length)?'<span class="mr-2">▶</span>':'';return `<article class="bg-white border rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition"><div class="h-44 bg-slate-200">${cover?`<img src="${esc(cover)}" alt="${esc(p.image_alt||p.title||'')}" class="w-full h-full object-cover" loading="lazy">`:'<div class="h-full flex items-center justify-center text-slate-400">النقطة</div>'}</div><div class="p-5"><span class="text-xs font-bold text-red-700">${videoMark}${esc(labels[p.section]||p.section||'مادة')}</span><h2 class="text-xl font-extrabold mt-2 leading-8">${esc(p.title||'بدون عنوان')}</h2><p class="text-slate-600 mt-2 line-clamp-3">${esc(p.excerpt||p.subtitle||'')}</p><div class="text-xs text-slate-500 mt-4">${formatDate(p.published_at||p.date||p.created_at)}${p.reading_time?' · '+esc(p.reading_time)+' دقيقة':''}</div><button data-slug="${esc(p.slug||'')}" class="read mt-4 font-bold text-red-700">قراءة المادة ←</button></div></article>`;}
function render(){const q=document.getElementById('search').value.trim().toLowerCase(),sec=document.getElementById('section').value,filtered=posts.filter(p=>(sec==='all'||p.section===sec)&&(!q||`${p.title||''} ${p.excerpt||''} ${p.subtitle||''}`.toLowerCase().includes(q)));document.getElementById('status').textContent=filtered.length?`عدد المواد: ${filtered.length}`:'لا توجد مواد منشورة مطابقة.';document.getElementById('grid').innerHTML=filtered.map(card).join('');document.querySelectorAll('.read').forEach(b=>b.onclick=()=>openPost(b.dataset.slug));}
function openPost(slug,push=true){const p=posts.find(x=>x.slug===slug);if(!p){showListing();return;}const cover=p.cover_image_url||p.image||'';const credits=[['الكاتب / المعد',p.writer_name||p.author],['المحرر',p.editor_name||p.editor],['المصور',p.photographer_name],['تصوير الفيديو',p.videographer_name],['المصمم',p.designer_name]].filter(x=>x[1]);document.getElementById('listing').classList.add('hidden');document.getElementById('reader').classList.remove('hidden');document.getElementById('article').innerHTML=`<div class="reader-hero rounded-2xl p-6 md:p-10 mb-8"><span class="text-red-300 font-bold">${esc(labels[p.section]||p.section||'مادة')}</span><h1 class="text-4xl md:text-5xl font-extrabold leading-tight mt-3">${esc(p.title||'بدون عنوان')}</h1><p class="text-xl text-slate-200 mt-4">${esc(p.subtitle||p.excerpt||'')}</p><div class="text-sm text-slate-300 mt-5">${formatDate(p.published_at||p.date||p.created_at)}</div></div>${cover?`<figure class="mb-8"><img src="${esc(cover)}" alt="${esc(p.title||'')}" class="w-full max-h-[520px] object-cover rounded-2xl">${p.cover_image_caption||p.cover_image_credit?`<figcaption class="text-sm text-slate-500 mt-2">${esc(p.cover_image_caption||'')}${p.cover_image_credit?' — '+esc(p.cover_image_credit):''}</figcaption>`:''}</figure>`:''}${credits.length||p.reading_time?`<div class="grid md:grid-cols-3 gap-4 mb-8">${credits.map(x=>`<div class="meta-card"><div class="text-xs text-slate-500">${esc(x[0])}</div><div class="font-bold mt-1">${esc(x[1])}</div></div>`).join('')}${p.reading_time?`<div class="meta-card"><div class="text-xs text-slate-500">وقت القراءة</div><div class="font-bold mt-1">${esc(p.reading_time)} دقيقة</div></div>`:''}</div>`:''}<div class="article-body text-lg">${bodyToHtml(p.body)}</div>${mediaBlock(p)}${p.methodology?`<section class="mt-10 border-t pt-6"><h2>المنهجية</h2><p>${esc(p.methodology)}</p></section>`:''}${p.right_of_reply?`<section class="mt-8 border-t pt-6"><h2>حق الرد</h2><p>${esc(p.right_of_reply)}</p></section>`:''}${listBlock('المصادر',p.sources)}${listBlock('الوثائق',p.documents)}${shareBlock(p)}`;if(push)history.pushState({slug},'',`newsroom.html?slug=${encodeURIComponent(slug)}`);window.scrollTo({top:0,behavior:'smooth'});}
function showListing(){document.getElementById('reader').classList.add('hidden');document.getElementById('listing').classList.remove('hidden');if(location.search)history.pushState({},'', 'newsroom.html');window.scrollTo({top:0,behavior:'smooth'});}
async function load(){try{const r=await fetch('data/posts.json',{cache:'no-store'});if(!r.ok)throw Error();const data=await r.json();posts=(data.posts||[]).filter(p=>p.status==='published');render();const slug=new URLSearchParams(location.search).get('slug');if(slug)openPost(slug,false);}catch(e){document.getElementById('status').textContent='تعذر تحميل المواد حاليًا.';}}
document.getElementById('search').oninput=render;document.getElementById('section').onchange=render;document.getElementById('back').onclick=showListing;window.onpopstate=()=>{const slug=new URLSearchParams(location.search).get('slug');slug?openPost(slug,false):showListing();};load();
</script>
<script src="public/supabase-public-config.js"></script>
<script src="public/newsroom-supabase.js"></script>

</body></html>

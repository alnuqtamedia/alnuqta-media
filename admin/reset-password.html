<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
  <title>تغيير كلمة المرور — النقطة</title>
  <style>
    :root{--bg:#071426;--panel:#0d2038;--line:#28415e;--text:#fff;--muted:#b9c7d8;--red:#ef3340;--ok:#59d39a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 18px 60px #0004}.brand{color:var(--red);font-weight:800}.muted{color:var(--muted);line-height:1.8}.field{display:grid;gap:8px;margin:16px 0}label{font-weight:700}input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#09192c;color:#fff;font-size:16px}button{border:0;border-radius:12px;padding:13px 18px;background:var(--red);color:#fff;font-weight:800;font-size:15px;cursor:pointer;width:100%}button:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:16px;min-height:24px;color:#ffd6d9}.status.ok{color:var(--ok)}a{color:#fff}
  </style>
</head>
<body><main>
  <div class="brand">النقطة — غرفة الأخبار</div><h1>اختيار كلمة مرور جديدة</h1>
  <p class="muted">استخدم كلمة مرور طويلة وفريدة لا تستعملها في حساب آخر.</p>
  <form id="passwordForm">
    <div class="field"><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" minlength="12" autocomplete="new-password" required></div>
    <div class="field"><label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required></div>
    <button id="submitButton" type="submit" disabled>تغيير كلمة المرور</button>
  </form>
  <div id="status" class="status" aria-live="polite">جاري التحقق من رابط الاستعادة…</div>
  <p><a href="./index.html">العودة إلى تسجيل الدخول</a></p>
</main>
<script src="../public/supabase-public-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const config=window.ALNUQTA_SUPABASE_PUBLIC||{},status=document.getElementById('status'),submitButton=document.getElementById('submitButton');
const client=config.url&&config.anonKey?supabase.createClient(config.url,config.anonKey):null;
function enableForm(){submitButton.disabled=false;status.textContent='اكتب كلمة المرور الجديدة.';}
if(!client){status.textContent='إعداد الاتصال غير متاح حالياً.';}else{
  client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)enableForm();});
  client.auth.getSession().then(({data})=>{if(data.session)enableForm();else setTimeout(()=>{if(submitButton.disabled)status.textContent='رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رابطاً جديداً من صفحة الدخول.';},2500);});
}
document.getElementById('passwordForm').addEventListener('submit',async event=>{
  event.preventDefault();const password=document.getElementById('password').value,confirmation=document.getElementById('confirmPassword').value;
  if(password.length<12){status.textContent='يجب أن تتكون كلمة المرور من 12 حرفاً على الأقل.';return;}
  if(password!==confirmation){status.textContent='كلمتا المرور غير متطابقتين.';return;}
  submitButton.disabled=true;status.textContent='جاري تغيير كلمة المرور…';const {error}=await client.auth.updateUser({password});
  if(error){status.textContent=error.message||'تعذر تغيير كلمة المرور.';submitButton.disabled=false;return;}
  await client.auth.signOut();status.textContent='تم تغيير كلمة المرور بنجاح. يمكنك تسجيل الدخول الآن.';status.classList.add('ok');document.getElementById('passwordForm').reset();setTimeout(()=>location.replace('./index.html'),1800);
});
</script>
</body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول — النقطة</title>
  <style>
    :root{--bg:#071426;--panel:#0d2038;--line:#28415e;--text:#fff;--muted:#b9c7d8;--red:#ef3340}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 18px 60px #0004}.brand{color:var(--red);font-weight:800}.muted{color:var(--muted);line-height:1.8}.field{display:grid;gap:8px;margin:16px 0}label{font-weight:700}input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:#09192c;color:#fff;font-size:16px}button{border:0;border-radius:12px;padding:13px 18px;background:var(--red);color:#fff;font-weight:800;font-size:15px;cursor:pointer;width:100%}.status{margin-top:16px;min-height:24px;color:#ffd6d9}.note{font-size:13px;color:var(--muted);margin-top:18px}.links{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.links a{color:#fff}.hidden{display:none}
  </style>
</head>
<body>
<main>
  <div class="brand">النقطة — غرفة الأخبار</div>
  <h1>تسجيل الدخول</h1>
  <p class="muted">ادخل إلى غرفة الأخبار لإدارة المواد الصحفية حسب صلاحيتك: Owner / Editor / Writer.</p>
  <form id="loginForm">
    <div class="field"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button type="submit">دخول إلى غرفة الأخبار</button>
    <button type="button" id="resetPassword" style="margin-top:10px;background:transparent;border:1px solid var(--line)">نسيت كلمة المرور</button>
  </form>
  <div id="status" class="status" aria-live="polite"></div>
  <p class="note">الدخول مخصص لفريق النقطة، وتُطبّق الصلاحيات حسب حساب المستخدم.</p>
  <div class="links"><a href="../newsroom.html">العودة إلى الموقع</a><a href="./dashboard.html">لوحة الإدارة</a></div>
</main>
<script src="../public/supabase-public-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const config = window.ALNUQTA_SUPABASE_PUBLIC || {};
const SUPABASE_URL = config.url || '';
const SUPABASE_ANON_KEY = config.anonKey || '';
const form = document.getElementById('loginForm');
const status = document.getElementById('status');
const client = SUPABASE_URL && SUPABASE_ANON_KEY ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  status.textContent = 'جاري تسجيل الدخول…';
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) { status.textContent = 'إعداد الاتصال غير متاح حاليًا. أعد تحميل الصفحة.'; return; }
  const { data, error } = await client.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  });
  if (error) { status.textContent = error.message || 'تعذر تسجيل الدخول.'; return; }
  if (!data.session) { status.textContent = 'لم يتم إنشاء جلسة تسجيل دخول.'; return; }
  const { data: aal, error: aalError } = await client.auth.mfa.getAuthenticatorAssuranceLevel();
  if (aalError) { status.textContent = 'تم الدخول، لكن تعذر فحص المصادقة الثنائية.'; return; }
  window.location.href = aal.nextLevel === 'aal2' && aal.currentLevel !== 'aal2'
    ? './mfa.html?next=dashboard.html'
    : './dashboard.html';
});
document.getElementById('resetPassword').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  if (!email) { status.textContent = 'اكتب بريدك الإلكتروني أولاً.'; return; }
  if (!client) { status.textContent = 'إعداد الاتصال غير متاح حاليًا.'; return; }
  status.textContent = 'جاري إرسال رابط الاستعادة…';
  const redirectTo = new URL('./reset-password.html', window.location.href).href;
  const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
  status.textContent = error ? (error.message || 'تعذر إرسال رابط الاستعادة.') : 'إذا كان البريد مسجلاً، ستصلك رسالة الاستعادة. افحص البريد غير المرغوب أيضاً.';
});
</script>
</body>
</html>

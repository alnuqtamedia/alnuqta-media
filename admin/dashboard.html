<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة غرفة الأخبار — النقطة</title>
<style>
:root{--bg:#071426;--panel:#0d2038;--panel2:#09192c;--line:#28415e;--text:#fff;--muted:#b9c7d8;--red:#ef3340;--ok:#59d39a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}header{padding:20px 5%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}.brand{color:var(--red);font-weight:800}.muted{color:var(--muted)}main{width:min(1200px,92%);margin:28px auto}.toolbar,.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--red);color:#fff;font-weight:800;cursor:pointer;text-decoration:none}.ghost{background:transparent;border:1px solid var(--line)}.publish{background:#18895d}.unpublish{background:#6b7280}.badge{display:inline-block;border-radius:999px;padding:6px 10px;background:#172e49;font-size:13px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.list{display:grid;gap:10px}.item{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:15px}.item:hover{border-color:#52779d}.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.item-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.item-actions button{padding:8px 11px;font-size:13px}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;color:var(--muted);font-size:13px}.field{display:grid;gap:7px;margin:12px 0}label{font-weight:700}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:#fff;font:inherit}textarea{min-height:170px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:22px;margin:10px 0;color:#ffd6d9}.ok{color:var(--ok)}
</style>
</head>
<body>
<header><div><div class="brand">النقطة — غرفة الأخبار</div><strong id="identity">جاري التحقق…</strong></div><div class="actions"><a class="btn ghost" href="../newsroom.html">الموقع</a><button id="logout" class="ghost">خروج</button></div></header>
<main>
<section class="toolbar"><button id="newArticle">+ مادة جديدة</button><span id="roleBadge" class="badge">الدور: …</span><span id="count" class="muted"></span></section>
<div class="grid">
<section class="card"><h2>المواد</h2><div id="status" class="status"></div><div id="articles" class="list"></div></section>
<section class="card"><h2 id="formTitle">مادة جديدة</h2><form id="articleForm"><input type="hidden" id="articleId">
<div class="field"><label>العنوان</label><input id="title" required></div><div class="field"><label>العنوان الفرعي</label><input id="subtitle"></div>
<div class="field"><label>النوع الصحفي</label><select id="section"><option value="news">خبر</option><option value="investigation">تحقيق استقصائي</option><option value="report">تقرير</option><option value="analysis">تحليل</option><option value="interview">مقابلة</option><option value="human-story">قصة إنسانية</option><option value="video">فيديو</option><option value="gallery">معرض صور</option></select></div>
<div class="field"><label>الحالة</label><select id="articleStatus"><option value="draft">مسودة</option><option value="review">قيد المراجعة</option><option value="ready">جاهز للنشر</option><option value="published">منشور</option></select></div>
<div class="field"><label>الملخص</label><textarea id="excerpt" style="min-height:90px"></textarea></div><div class="field"><label>الصورة البارزة — رابط الصورة</label><input id="image" type="url"></div>
<div class="field"><label>وقت القراءة بالدقائق</label><input id="readingTime" type="number" min="1"></div><div class="field"><label>المصادر — مصدر في كل سطر</label><textarea id="sources" style="min-height:90px"></textarea></div>
<div class="field"><label>المنهجية</label><textarea id="methodology" style="min-height:90px"></textarea></div><div class="field"><label>حق الرد</label><textarea id="rightOfReply" style="min-height:90px"></textarea></div><div class="field"><label>محتوى المادة</label><textarea id="body"></textarea></div>
<div class="actions"><button type="submit">حفظ المادة</button><button type="button" id="reset" class="ghost">تفريغ</button></div></form></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://zsqvmuqlmtnhndwuqlfy.supabase.co';const key=localStorage.getItem('alnuqta_supabase_anon_key');if(!key)window.location.href='./index.html';
const client=supabase.createClient(SUPABASE_URL,key);let currentUser=null,currentProfile=null,articles=[];const $=id=>document.getElementById(id);const labels={owner:'مالك المنصة',editor:'محرر',writer:'كاتب'};const stateLabels={draft:'مسودة',review:'قيد المراجعة',ready:'جاهز للنشر',published:'منشور'};
function msg(v,ok=false){$('status').textContent=v;$('status').className='status'+(ok?' ok':'')}
function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function allowed(s){if(currentProfile.role==='owner')return true;if(currentProfile.role==='editor')return ['draft','review','ready'].includes(s);return ['draft','review'].includes(s)}
async function init(){const {data:{session}}=await client.auth.getSession();if(!session){location.href='./index.html';return}currentUser=session.user;const {data,error}=await client.from('profiles').select('id,full_name,role').eq('id',currentUser.id).single();if(error||!data){msg('تعذر تحميل صلاحيات حسابك.');return}currentProfile=data;$('identity').textContent=data.full_name||currentUser.email;$('roleBadge').textContent='الدور: '+(labels[data.role]||data.role);if(data.role!=='owner'){$('articleStatus').querySelector('[value="published"]').remove()}if(data.role==='writer'){$('articleStatus').querySelector('[value="ready"]').remove()}await load()}
async function load(){let q=client.from('articles').select('*').order('updated_at',{ascending:false});if(currentProfile.role==='writer')q=q.eq('author_id',currentUser.id);const {data,error}=await q;if(error){msg(error.message);return}articles=data||[];$('count').textContent=`${articles.length} مادة`;$('articles').innerHTML=articles.length?articles.map(a=>`<article class="item"><div class="item-head"><div><strong>${esc(a.title)}</strong><div class="meta"><span>${stateLabels[a.status]||a.status}</span><span>${esc(a.section)}</span><span>${a.updated_at?new Date(a.updated_at).toLocaleString('ar-IQ'):''}</span></div></div></div><div class="item-actions"><button type="button" class="ghost" data-action="edit" data-id="${a.id}">تعديل</button>${currentProfile.role==='owner'&&a.status!=='published'?`<button type="button" class="publish" data-action="publish" data-id="${a.id}">نشر الآن</button>`:''}${currentProfile.role==='owner'&&a.status==='published'?`<button type="button" class="unpublish" data-action="unpublish" data-id="${a.id}">إلغاء النشر</button>`:''}</div></article>`).join(''):'<p class="muted">لا توجد مواد حتى الآن.</p>';document.querySelectorAll('[data-action="edit"]').forEach(x=>x.onclick=()=>edit(x.dataset.id));document.querySelectorAll('[data-action="publish"]').forEach(x=>x.onclick=()=>publishArticle(x.dataset.id));document.querySelectorAll('[data-action="unpublish"]').forEach(x=>x.onclick=()=>unpublishArticle(x.dataset.id))}
async function publishArticle(id){if(currentProfile.role!=='owner')return;const a=articles.find(x=>x.id===id);if(!a)return;if(!confirm(`نشر المادة «${a.title}» الآن؟`))return;msg('جاري نشر المادة…');const {error}=await client.from('articles').update({status:'published'}).eq('id',id);if(error){msg(error.message);return}msg('تم نشر المادة بنجاح.',true);await load()}
async function unpublishArticle(id){if(currentProfile.role!=='owner')return;const a=articles.find(x=>x.id===id);if(!a)return;if(!confirm(`إلغاء نشر المادة «${a.title}»؟`))return;msg('جاري إلغاء النشر…');const {error}=await client.from('articles').update({status:'ready'}).eq('id',id);if(error){msg(error.message);return}msg('تم إلغاء النشر وإرجاع المادة إلى «جاهز للنشر».',true);await load()}
function reset(){ $('articleId').value='';$('formTitle').textContent='مادة جديدة';['title','subtitle','excerpt','image','readingTime','sources','methodology','rightOfReply','body'].forEach(id=>$(id).value='');$('section').value='news';$('articleStatus').value='draft'}
function edit(id){const a=articles.find(x=>x.id===id);if(!a)return;$('articleId').value=a.id;$('formTitle').textContent='تعديل المادة';$('title').value=a.title||'';$('subtitle').value=a.subtitle||'';$('section').value=a.section||'news';$('articleStatus').value=a.status||'draft';$('excerpt').value=a.excerpt||'';$('image').value=a.image||'';$('readingTime').value=a.reading_time||'';$('sources').value=Array.isArray(a.sources)?a.sources.join('\n'):'';$('methodology').value=a.methodology||'';$('rightOfReply').value=a.right_of_reply||'';$('body').value=a.body||'';scrollTo({top:0,behavior:'smooth'})}
$('articleForm').onsubmit=async e=>{e.preventDefault();const wanted=$('articleStatus').value;if(!allowed(wanted)){msg('هذه الحالة غير مسموحة لدورك.');return}msg('جاري الحفظ…');const id=$('articleId').value;const payload={title:$('title').value.trim(),subtitle:$('subtitle').value.trim()||null,section:$('section').value,status:wanted,excerpt:$('excerpt').value.trim()||null,image:$('image').value.trim()||null,reading_time:$('readingTime').value?Number($('readingTime').value):null,sources:$('sources').value.split('\n').map(x=>x.trim()).filter(Boolean),methodology:$('methodology').value.trim()||null,right_of_reply:$('rightOfReply').value.trim()||null,body:$('body').value};const result=id?await client.from('articles').update(payload).eq('id',id):await client.from('articles').insert({...payload,author_id:currentUser.id});if(result.error){msg(result.error.message);return}msg('تم حفظ المادة بنجاح.',true);if(id){await load();edit(id)}else{reset();await load()}};
$('newArticle').onclick=reset;$('reset').onclick=reset;$('logout').onclick=async()=>{await client.auth.signOut();location.href='./index.html'};init();
</script></body></html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="التحقيقات الاستقصائية المنشورة من غرفة أخبار النقطة.">
  <title>التحقيقات الاستقصائية | النقطة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:Tajawal,sans-serif;background:#06101e;color:#fff}.font-cairo{font-family:Cairo,sans-serif}</style>
</head>
<body>
  <header class="border-b border-slate-700 bg-[#0A1A2F]">
    <div class="max-w-6xl mx-auto px-5 py-5 flex flex-wrap items-center justify-between gap-4">
      <a href="index.html" class="font-cairo font-black text-2xl">النقطة <span class="text-red-500">Media</span></a>
      <nav class="flex flex-wrap gap-4 text-sm font-cairo font-bold">
        <a href="index.html" class="hover:text-red-400">الرئيسية</a>
        <a href="newsroom.html" class="hover:text-red-400">غرفة الأخبار</a>
        <a href="investigations.html" class="text-red-400">التحقيقات</a>
        <a href="documents.html" class="hover:text-red-400">الوثائق</a>
        <a href="about.html" class="hover:text-red-400">عن النقطة</a>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-5 py-12">
    <p class="text-red-400 font-cairo font-bold">التحقيقات الاستقصائية</p>
    <h1 class="font-cairo font-black text-4xl mt-3">ملفات النقطة</h1>
    <p class="text-slate-300 mt-4">تعرض هذه الصفحة التحقيقات المنشورة فعلياً من غرفة أخبار النقطة.</p>
    <p id="status" class="text-slate-400 mt-8" role="status">جاري تحميل التحقيقات…</p>
    <div id="investigations" class="grid md:grid-cols-2 gap-6 mt-6"></div>
  </main>
  <footer class="border-t border-slate-700 bg-[#0A1A2F] mt-10">
    <div class="max-w-6xl mx-auto px-5 py-7 text-sm text-slate-400 flex flex-wrap justify-between gap-4"><span>© النقطة Media 2026</span><nav class="flex flex-wrap gap-4"><a href="contact.html">تواصل معنا</a><a href="privacy.html">الخصوصية</a><a href="editorial-policy.html">سياسة التحرير</a><a href="corrections.html">التصحيحات</a></nav></div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="public/supabase-public-config.js"></script>
  <script>
    const esc=(value='')=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const formatDate=value=>value?new Date(value).toLocaleDateString('ar-IQ',{year:'numeric',month:'long',day:'numeric'}):'';
    const config=window.ALNUQTA_SUPABASE_PUBLIC||{};
    const status=document.getElementById('status');
    const grid=document.getElementById('investigations');

    async function loadInvestigations(){
      if(!config.url||!config.anonKey){status.textContent='تعذر تحميل التحقيقات: إعداد الاتصال غير متوفر.';return;}
      const client=supabase.createClient(config.url,config.anonKey);
      const {data,error}=await client.from('articles')
        .select('id,title,subtitle,excerpt,cover_image_url,image,published_at,created_at,reading_time')
        .eq('status','published').eq('section','investigation')
        .order('published_at',{ascending:false,nullsFirst:false});
      if(error){status.textContent='تعذر تحميل التحقيقات حالياً.';return;}
      const rows=Array.isArray(data)?data:[];
      status.textContent=rows.length?`عدد التحقيقات المنشورة: ${rows.length}`:'لا توجد تحقيقات منشورة حالياً.';
      grid.innerHTML=rows.map(item=>{
        const cover=item.cover_image_url||item.image||'';
        const url=`newsroom.html?slug=${encodeURIComponent(item.id||'')}`;
        return `<article class="bg-[#122238] border border-slate-700 rounded-2xl overflow-hidden">
          ${cover?`<img src="${esc(cover)}" alt="${esc(item.title||'')}" class="w-full h-56 object-cover" loading="lazy">`:''}
          <div class="p-6"><span class="text-xs bg-red-600 px-3 py-1 rounded-full font-cairo font-bold">ملف استقصائي</span>
          <h2 class="font-cairo font-black text-2xl mt-4 leading-10">${esc(item.title||'بدون عنوان')}</h2>
          <p class="text-slate-300 mt-4 leading-8">${esc(item.excerpt||item.subtitle||'')}</p>
          <div class="text-sm text-slate-400 mt-4">${formatDate(item.published_at||item.created_at)}${item.reading_time?` · ${esc(item.reading_time)} دقيقة`:''}</div>
          <a href="${url}" class="inline-block mt-6 bg-red-600 hover:bg-red-700 px-5 py-3 rounded-lg font-cairo font-bold">قراءة التحقيق</a></div>
        </article>`;
      }).join('');
    }
    loadInvestigations();
  </script>
</body>
</html>

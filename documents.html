<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="الوثائق والمستندات المرتبطة بمواد النقطة المنشورة.">
  <title>أرشيف الوثائق | النقطة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>body{font-family:Tajawal,sans-serif;background:#06101e;color:#fff}.font-cairo{font-family:Cairo,sans-serif}</style>
</head>
<body>
  <header class="border-b border-slate-700 bg-[#0A1A2F]">
    <div class="max-w-6xl mx-auto px-5 py-5 flex flex-wrap items-center justify-between gap-4">
      <a href="index.html" class="font-cairo font-black text-2xl">النقطة <span class="text-red-500">Media</span></a>
      <nav class="flex flex-wrap gap-4 text-sm font-cairo font-bold">
        <a href="index.html" class="hover:text-red-400">الرئيسية</a><a href="newsroom.html" class="hover:text-red-400">غرفة الأخبار</a>
        <a href="investigations.html" class="hover:text-red-400">التحقيقات</a><a href="documents.html" class="text-red-400">الوثائق</a>
        <a href="about.html" class="hover:text-red-400">عن النقطة</a>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-5 py-12">
    <p class="text-red-400 font-cairo font-bold">أرشيف الوثائق</p>
    <h1 class="font-cairo font-black text-4xl mt-3">الوثائق والمستندات</h1>
    <p class="text-slate-300 mt-4">يعرض الأرشيف فقط الوثائق المرتبطة بمواد منشورة فعلياً من غرفة أخبار النقطة.</p>
    <p id="status" class="text-slate-400 mt-8" role="status">جاري تحميل الوثائق…</p>
    <div id="documents" class="grid gap-4 mt-6"></div>
  </main>
  <footer class="border-t border-slate-700 bg-[#0A1A2F] mt-10"><div class="max-w-6xl mx-auto px-5 py-7 text-sm text-slate-400 flex flex-wrap justify-between gap-4"><span>© النقطة Media 2026</span><nav class="flex flex-wrap gap-4"><a href="contact.html">تواصل معنا</a><a href="privacy.html">الخصوصية</a><a href="editorial-policy.html">سياسة التحرير</a><a href="corrections.html">التصحيحات</a></nav></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="public/supabase-public-config.js"></script>
  <script>
    const esc=(value='')=>String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]));
    const safeUrl=value=>{try{const url=new URL(String(value));return ['http:','https:'].includes(url.protocol)?url.href:''}catch{return ''}};
    const config=window.ALNUQTA_SUPABASE_PUBLIC||{};
    const status=document.getElementById('status'),box=document.getElementById('documents');

    async function loadDocuments(){
      if(!config.url||!config.anonKey){status.textContent='تعذر تحميل الوثائق: إعداد الاتصال غير متوفر.';return;}
      const client=supabase.createClient(config.url,config.anonKey);
      const {data,error}=await client.from('articles').select('id,title,documents,published_at').eq('status','published').order('published_at',{ascending:false,nullsFirst:false});
      if(error){status.textContent='تعذر تحميل الوثائق حالياً.';return;}
      const rows=[];
      for(const article of data||[]){
        for(const entry of Array.isArray(article.documents)?article.documents:[]){
          const item=typeof entry==='string'?{title:entry,url:''}:entry||{};
          if(!String(item.title||item.name||item.url||'').trim())continue;
          rows.push({articleId:article.id,articleTitle:article.title,title:item.title||item.name||item.url,url:safeUrl(item.url||'')});
        }
      }
      status.textContent=rows.length?`عدد الوثائق المنشورة: ${rows.length}`:'لا توجد وثائق منشورة حالياً.';
      box.innerHTML=rows.map(item=>`<article class="bg-[#122238] border border-slate-700 rounded-2xl p-5">
        <h2 class="font-cairo font-bold text-xl">${esc(item.title)}</h2>
        <p class="text-slate-400 mt-2">مرتبطة بالمادة: ${esc(item.articleTitle||'بدون عنوان')}</p>
        <div class="flex flex-wrap gap-3 mt-4">${item.url?`<a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-bold">فتح الوثيقة</a>`:''}<a href="newsroom.html?slug=${encodeURIComponent(item.articleId||'')}" class="border border-slate-600 hover:border-red-500 px-4 py-2 rounded-lg font-bold">قراءة المادة</a></div>
      </article>`).join('');
    }
    loadDocuments();
  </script>
</body>
</html>
